<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>구슬 레이싱 배팅 일지</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='felt' cx='50%25' cy='40%25' r='70%25'%3E%3Cstop offset='0%25' stop-color='%23164a35'/%3E%3Cstop offset='100%25' stop-color='%2308281c'/%3E%3C/radialGradient%3E%3CradialGradient id='marble' cx='38%25' cy='32%25' r='65%25'%3E%3Cstop offset='0%25' stop-color='%23f6dd8a'/%3E%3Cstop offset='55%25' stop-color='%23d4af37'/%3E%3Cstop offset='100%25' stop-color='%237a5c14'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23felt)' stroke='%23d4af37' stroke-width='2.5'/%3E%3Cg stroke='%23d4af37' stroke-width='3' stroke-linecap='round'%3E%3Cline x1='32' y1='3' x2='32' y2='9'/%3E%3Cline x1='32' y1='55' x2='32' y2='61'/%3E%3Cline x1='3' y1='32' x2='9' y2='32'/%3E%3Cline x1='55' y1='32' x2='61' y2='32'/%3E%3Cline x1='11.5' y1='11.5' x2='15.8' y2='15.8'/%3E%3Cline x1='48.2' y1='48.2' x2='52.5' y2='52.5'/%3E%3Cline x1='11.5' y1='52.5' x2='15.8' y2='48.2'/%3E%3Cline x1='48.2' y1='15.8' x2='52.5' y2='11.5'/%3E%3C/g%3E%3Ccircle cx='32' cy='33' r='15' fill='url(%23marble)' stroke='%237a5c14' stroke-width='1'/%3E%3Cellipse cx='27' cy='27' rx='4.5' ry='3' fill='%23fff6d9' opacity='0.75'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-deep: #0a2e22;
    --felt: #0f3d2b;
    --felt-light: #164a35;
    --ink: #071510;
    --gold: #d4af37;
    --gold-bright: #f0d270;
    --gold-dim: #8a7127;
    --cream: #f1e8d0;
    --cream-dim: #cfc4a2;
    --crimson: #8e1f34;
    --crimson-bright: #c22a45;
    --shadow: rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(212,175,55,0.08), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.6), transparent 70%),
      linear-gradient(180deg, var(--ink) 0%, var(--felt-deep) 40%, var(--ink) 100%);
    background-attachment: fixed;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--cream);
    padding: 40px 20px 80px;
    position: relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(212,175,55,0.02) 0 2px, transparent 2px 40px),
      repeating-linear-gradient(-45deg, rgba(212,175,55,0.02) 0 2px, transparent 2px 40px);
    pointer-events:none;
    z-index:0;
  }

  .wrap{ max-width: 1100px; margin: 0 auto; position:relative; z-index:1; }

  header{ text-align:center; margin-bottom: 36px; }

  .kicker{
    font-family:'Noto Sans KR', sans-serif;
    letter-spacing: 0.35em;
    font-size: 12px;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1{
    font-family:'Noto Serif KR', serif;
    font-weight: 900;
    font-size: clamp(32px, 5vw, 52px);
    margin: 0 0 8px;
    color: var(--gold-bright);
    text-shadow: 0 0 18px rgba(212,175,55,0.35), 0 2px 0 rgba(0,0,0,0.6);
    letter-spacing: 0.02em;
  }

  .sub{
    font-size: 14px;
    color: var(--cream-dim);
    letter-spacing: 0.05em;
  }

  .divider{
    width: 140px; height:2px; margin: 20px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* ---------- Marble Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 22px;
    margin-bottom: 40px;
  }

  .card{
    background: linear-gradient(180deg, var(--felt-light), var(--felt) 60%, var(--felt-deep));
    border: 1px solid rgba(212,175,55,0.35);
    border-radius: 14px;
    padding: 20px 18px 18px;
    position: relative;
    box-shadow: 0 10px 30px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.04);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card:hover{ transform: translateY(-2px); }

  .card::before{
    content:"";
    position:absolute; inset:6px;
    border: 1px solid rgba(212,175,55,0.15);
    border-radius: 10px;
    pointer-events:none;
  }

  .card-head{
    display:flex; align-items:center; gap: 12px;
    margin-bottom: 14px;
    min-width: 0;
  }

  .badge{
    width: 44px; height:44px; min-width:44px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size: 20px;
    color: var(--ink);
    box-shadow: 0 3px 8px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.4);
    border: 2px solid rgba(0,0,0,0.25);
  }

  .name-input{
    flex:1;
    min-width: 0;
    width: 100%;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 8px;
    padding: 10px 12px;
    font-family:'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--gold-bright);
    outline:none;
  }
  .name-input:focus{ border-color: var(--gold); box-shadow: 0 0 0 2px rgba(212,175,55,0.2); }
  .name-input:disabled{
    color: var(--gold-bright);
    opacity: 0.9;
    border-color: rgba(212,175,55,0.15);
    background: rgba(0,0,0,0.35);
  }

  .bettor-label{
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--cream-dim);
    margin: 4px 2px 8px;
  }

  .bettor-list{ display:flex; flex-direction:column; gap: 8px; }

  .bettor-input{
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(241,232,208,0.18);
    border-radius: 7px;
    padding: 9px 11px;
    color: var(--cream);
    font-size: 14px;
    outline:none;
    transition: border-color .15s ease, background .15s ease;
  }
  .bettor-input::placeholder{ color: rgba(241,232,208,0.35); }
  .bettor-input:focus{ border-color: var(--gold); background: rgba(0,0,0,0.35); }
  .bettor-input:disabled{
    opacity: 0.55;
    border-color: rgba(241,232,208,0.08);
  }

  .hint{
    font-size: 11px;
    color: var(--gold-dim);
    margin-top: 8px;
    display:flex; align-items:center; gap:6px;
  }
  .hint::before{ content:"↵"; font-weight:700; }

  /* ---------- Start Button ---------- */
  .action-row{ display:flex; justify-content:center; margin: 10px 0 30px; }

  .btn-start{
    background: linear-gradient(180deg, var(--crimson-bright), var(--crimson));
    color: var(--cream);
    border: 1px solid rgba(212,175,55,0.6);
    padding: 16px 48px;
    font-family:'Noto Serif KR', serif;
    font-weight: 900;
    font-size: 19px;
    letter-spacing: 0.08em;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 8px 24px rgba(142,31,52,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-start:hover{ transform: translateY(-2px); box-shadow: 0 12px 30px rgba(142,31,52,0.6); }
  .btn-start:active{ transform: translateY(0); }
  .btn-start:disabled{
    background: #3a3a3a; color:#888; box-shadow:none; cursor:not-allowed; border-color:#555;
  }

  /* ---------- Race Section ---------- */
  #raceSection{ display:none; text-align:center; }

  .race-q{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size: 24px;
    color: var(--gold-bright);
    margin-bottom: 26px;
  }

  .race-grid{
    display:grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    max-width: 560px;
    margin: 0 auto 30px;
  }

  @media (max-width: 480px){
    .race-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .race-btn{ padding: 14px 4px; font-size: 13px; }
    .race-btn .r-badge{ width: 30px; height: 30px; margin-bottom: 6px; }
  }

  .race-btn{
    background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent);
    border: 2px solid var(--gold-dim);
    border-radius: 12px;
    padding: 22px 10px;
    cursor:pointer;
    color: var(--cream);
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size: 16px;
    transition: all .15s ease;
    position:relative;
  }
  .race-btn .r-badge{
    width:38px;height:38px;border-radius:50%;margin:0 auto 10px;
    display:flex;align-items:center;justify-content:center;
    font-weight:900; color: var(--ink);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.4);
  }
  .race-btn:hover{ border-color: var(--gold); background: rgba(212,175,55,0.08); transform: translateY(-3px); }

  .race-btn .rank-tag{
    position:absolute; top:-11px; left:50%; transform:translateX(-50%);
    font-family:'Noto Sans KR', sans-serif;
    font-size: 11px;
    font-weight:700;
    padding: 3px 12px;
    border-radius: 999px;
    letter-spacing: 0.05em;
    display:none;
    box-shadow: 0 3px 8px rgba(0,0,0,0.5);
  }

  .race-btn.rank1{
    border-color: var(--gold-bright);
    background: rgba(212,175,55,0.14);
    box-shadow: 0 0 0 2px rgba(212,175,55,0.3), 0 8px 20px rgba(212,175,55,0.15);
  }
  .race-btn.rank1 .rank-tag{
    display:inline-block;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: var(--ink);
  }
  .race-btn.rank1 .rank-tag::before{ content:"🥇 "; }

  .race-btn.rank2{
    border-color: #b9c2c9;
    background: rgba(200,210,220,0.10);
    box-shadow: 0 0 0 2px rgba(200,210,220,0.25), 0 8px 20px rgba(200,210,220,0.1);
  }
  .race-btn.rank2 .rank-tag{
    display:inline-block;
    background: linear-gradient(180deg, #e7ecef, #b9c2c9);
    color: var(--ink);
  }
  .race-btn.rank2 .rank-tag::before{ content:"🥈 "; }

  .confirm-rank-row{ display:flex; justify-content:center; margin: 4px 0 22px; }

  .btn-confirm-rank{
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: var(--ink);
    border: none;
    padding: 13px 42px;
    font-family:'Noto Serif KR', serif;
    font-weight: 900;
    font-size: 16px;
    letter-spacing: 0.06em;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 8px 20px rgba(212,175,55,0.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-confirm-rank:hover{ transform: translateY(-2px); }
  .btn-confirm-rank:disabled{
    background:#3a3a3a; color:#888; box-shadow:none; cursor:not-allowed;
  }

  .rank-hint{
    font-size: 12px;
    color: var(--cream-dim);
    margin-bottom: 22px;
  }

  .back-link{
    background:none; border:none; color: var(--cream-dim); text-decoration:underline;
    cursor:pointer; font-size: 13px; margin-top: 6px;
  }

  .modal-question{
    font-size: 16px;
    color: var(--cream);
    margin: 0 0 24px;
    line-height: 1.5;
  }

  .modal-yesno-row{
    display:flex; gap: 14px; justify-content:center;
  }

  .btn-yes{
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: var(--ink);
    border: none;
    padding: 12px 32px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    cursor:pointer;
  }
  .btn-yes:hover{ filter: brightness(1.05); }

  .btn-no{
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--cream);
    padding: 12px 32px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    cursor:pointer;
  }
  .btn-no:hover{ border-color: var(--gold); background: rgba(212,175,55,0.08); }

  .mochi-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }

  .mochi-btn{
    background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent);
    border: 2px solid var(--gold-dim);
    border-radius: 10px;
    padding: 14px 6px;
    cursor:pointer;
    color: var(--cream);
    font-family:'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 13px;
    transition: all .15s ease;
  }
  .mochi-btn .m-badge{
    width: 30px; height:30px; border-radius:50%; margin: 0 auto 8px;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; color: var(--ink); font-size: 13px;
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.4);
  }
  .mochi-btn:hover{ border-color: var(--gold); }
  .mochi-btn.selected{
    border-color: var(--gold-bright);
    background: rgba(212,175,55,0.16);
    box-shadow: 0 0 0 2px rgba(212,175,55,0.3);
  }

  .rank-block .rank-medal{ font-size: 20px; }

  /* ---------- Modal ---------- */
  .overlay{
    display:none;
    position: fixed; inset:0;
    background: rgba(2,8,5,0.78);
    backdrop-filter: blur(3px);
    align-items:center; justify-content:center;
    z-index: 100;
    padding: 20px;
  }
  .overlay.show{ display:flex; }

  .modal{
    background: linear-gradient(180deg, var(--felt-light), var(--felt-deep));
    border: 1px solid var(--gold);
    border-radius: 16px;
    max-width: 460px; width:100%;
    padding: 30px 28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    text-align:center;
    animation: pop .18s ease;
  }
  @keyframes pop{ from{ transform: scale(0.92); opacity:0;} to{ transform:scale(1); opacity:1; } }

  .modal h2{
    font-family:'Noto Serif KR', serif;
    color: var(--gold-bright);
    font-size: 20px;
    margin: 0 0 18px;
  }

  .rank-block{ margin-bottom: 20px; text-align:left; }
  .rank-block:last-of-type{ margin-bottom: 22px; }

  .rank-block-head{
    display:flex; align-items:center; gap: 8px;
    margin-bottom: 10px;
  }
  .rank-medal{ font-size: 20px; }
  .rank-title{
    font-family:'Noto Serif KR', serif;
    font-size: 13px;
    color: var(--cream-dim);
    letter-spacing: 0.1em;
  }
  .rank-marble-name{
    font-family:'Noto Serif KR', serif;
    font-size: 20px;
    font-weight: 900;
    color: var(--gold-bright);
    margin-left: auto;
    text-shadow: 0 0 10px rgba(212,175,55,0.35);
  }

  .winner-list{
    list-style:none; padding:0; margin: 0;
    display:flex; flex-direction:column; gap:7px;
    max-height: 160px; overflow-y:auto;
  }
  .winner-list li{
    background: rgba(212,175,55,0.08);
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14px;
    color: var(--cream);
  }
  .winner-list .empty{
    color: var(--cream-dim);
    font-style: italic;
    background: rgba(255,255,255,0.03);
    border-style: dashed;
  }

  .btn-confirm{
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: var(--ink);
    border:none;
    padding: 12px 40px;
    border-radius: 999px;
    font-weight:700;
    font-size: 15px;
    cursor:pointer;
    letter-spacing: 0.04em;
  }
  .btn-confirm:hover{ filter: brightness(1.05); }

  footer{
    text-align:center; margin-top: 50px;
    color: var(--cream-dim); font-size: 11px; letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">Class Booth &middot; Table Log</div>
    <h1>구슬 레이싱 배팅 일지</h1>
    <div class="sub">네 개의 구슬, 하나의 승자 — 배팅을 기록하세요</div>
    <div class="divider"></div>
  </header>

  <section id="setupSection">
    <div class="grid" id="marbleGrid"></div>
    <div class="action-row">
      <button class="btn-start" id="startBtn">게임 시작</button>
    </div>
  </section>

  <section id="raceSection">
    <div class="race-q">어느 구슬이 먼저 도착했나요?</div>
    <div class="rank-hint">첫 번째로 누른 구슬이 1등, 두 번째로 누른 구슬이 2등입니다 · 다시 누르면 선택이 취소됩니다</div>
    <div class="race-grid" id="raceGrid"></div>
    <div class="confirm-rank-row">
      <button class="btn-confirm-rank" id="confirmRankBtn" disabled>순위 확정</button>
    </div>
    <button class="back-link" id="backBtn">← 배팅 다시 설정하기</button>
  </section>

  <footer>DAEGON HIGH SCHOOL &nbsp;·&nbsp; MARBLE RACE TABLE &nbsp;·&nbsp; MADE BY HYUNSU</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalCard"></div>
</div>

<script>
  const NUMS = ['①','②','③','④'];
  const COLORS = ['#c0392b','#2980b9','#2e9e5b','#8e44ad'];

  const marbleGrid = document.getElementById('marbleGrid');
  const raceGrid = document.getElementById('raceGrid');
  const setupSection = document.getElementById('setupSection');
  const raceSection = document.getElementById('raceSection');
  const startBtn = document.getElementById('startBtn');
  const backBtn = document.getElementById('backBtn');
  const confirmRankBtn = document.getElementById('confirmRankBtn');
  const overlay = document.getElementById('overlay');
  const modalCard = document.getElementById('modalCard');

  let gameStarted = false;

  function createBettorInput(container, isDisabled){
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'bettor-input';
    input.placeholder = '배팅자 이름 입력 후 Enter';
    input.disabled = isDisabled;
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        if(input.value.trim() === '') return;
        const inputs = container.querySelectorAll('.bettor-input');
        const isLast = inputs[inputs.length - 1] === input;
        if(isLast){
          const next = createBettorInput(container, false);
          container.appendChild(next);
          next.focus();
        }
      }
    });
    return input;
  }

  function buildMarbleCard(index){
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = index;

    const head = document.createElement('div');
    head.className = 'card-head';

    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.style.background = `linear-gradient(160deg, ${COLORS[index]}, ${shade(COLORS[index])})`;
    badge.textContent = NUMS[index];

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'name-input';
    nameInput.value = `구슬 ${NUMS[index]}`;
    nameInput.dataset.role = 'marble-name';

    head.appendChild(badge);
    head.appendChild(nameInput);

    const label = document.createElement('div');
    label.className = 'bettor-label';
    label.textContent = '배팅자 명단';

    const list = document.createElement('div');
    list.className = 'bettor-list';
    list.dataset.role = 'bettor-list';
    list.appendChild(createBettorInput(list, false));

    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = 'Enter 키를 누르면 다음 배팅자 칸이 생성됩니다';

    card.appendChild(head);
    card.appendChild(label);
    card.appendChild(list);
    card.appendChild(hint);
    return card;
  }

  function shade(hex){
    // simple darken for gradient companion tone
    const n = parseInt(hex.slice(1),16);
    let r = (n>>16) - 40, g = ((n>>8)&0xff) - 40, b = (n&0xff) - 40;
    r = Math.max(0,r); g = Math.max(0,g); b = Math.max(0,b);
    return `rgb(${r},${g},${b})`;
  }

  function init(){
    marbleGrid.innerHTML = '';
    raceGrid.innerHTML = '';
    for(let i=0;i<4;i++){
      marbleGrid.appendChild(buildMarbleCard(i));

      const rb = document.createElement('button');
      rb.className = 'race-btn';
      rb.dataset.index = i;
      const rBadge = document.createElement('div');
      rBadge.className = 'r-badge';
      rBadge.style.background = `linear-gradient(160deg, ${COLORS[i]}, ${shade(COLORS[i])})`;
      rBadge.textContent = NUMS[i];
      const rLabel = document.createElement('div');
      rLabel.dataset.role = 'race-label';
      rLabel.textContent = `구슬 ${NUMS[i]}`;
      const rankTag = document.createElement('span');
      rankTag.className = 'rank-tag';
      rb.appendChild(rankTag);
      rb.appendChild(rBadge);
      rb.appendChild(rLabel);
      rb.addEventListener('click', () => toggleSelect(i));
      raceGrid.appendChild(rb);
    }
  }

  startBtn.addEventListener('click', () => {
    // lock all inputs
    document.querySelectorAll('.name-input, .bettor-input').forEach(el => el.disabled = true);
    // sync race button labels with chosen marble names
    document.querySelectorAll('#marbleGrid .card').forEach(card => {
      const idx = card.dataset.index;
      const nameVal = card.querySelector('.name-input').value.trim() || `구슬 ${NUMS[idx]}`;
      const label = raceGrid.querySelector(`.race-btn[data-index="${idx}"] [data-role="race-label"]`);
      label.textContent = nameVal;
    });
    gameStarted = true;
    setupSection.style.display = 'none';
    raceSection.style.display = 'block';
  });

  backBtn.addEventListener('click', () => {
    document.querySelectorAll('.name-input, .bettor-input').forEach(el => el.disabled = false);
    ranking = [null, null];
    updateRaceButtonsUI();
    gameStarted = false;
    raceSection.style.display = 'none';
    setupSection.style.display = 'block';
  });

  let ranking = [null, null]; // [1st place marble index, 2nd place marble index]

  function toggleSelect(index){
    if(ranking[0] === index){
      ranking[0] = null;
    } else if(ranking[1] === index){
      ranking[1] = null;
    } else if(ranking[0] === null){
      ranking[0] = index;
    } else if(ranking[1] === null){
      ranking[1] = index;
    } else {
      return; // both ranks already filled, ignore extra clicks
    }
    updateRaceButtonsUI();
  }

  function updateRaceButtonsUI(){
    raceGrid.querySelectorAll('.race-btn').forEach(btn => {
      const idx = Number(btn.dataset.index);
      btn.classList.remove('rank1', 'rank2');
      const tag = btn.querySelector('.rank-tag');
      if(ranking[0] === idx){ btn.classList.add('rank1'); tag.textContent = '1등'; }
      else if(ranking[1] === idx){ btn.classList.add('rank2'); tag.textContent = '2등'; }
    });
    confirmRankBtn.disabled = ranking[0] === null;
  }

  function getBettors(index){
    const card = marbleGrid.querySelector(`.card[data-index="${index}"]`);
    return Array.from(card.querySelectorAll('.bettor-input'))
      .map(i => i.value.trim())
      .filter(v => v !== '');
  }

  function getMarbleName(index){
    const card = marbleGrid.querySelector(`.card[data-index="${index}"]`);
    return card.querySelector('.name-input').value.trim() || `구슬 ${NUMS[index]}`;
  }

  let modalStep = null; // 'ask' | 'select' | 'final'
  let mochiSelected = new Set();

  function renderAskMochi(){
    modalStep = 'ask';
    modalCard.innerHTML = '';

    const h2 = document.createElement('h2');
    h2.textContent = '🎱 모찌 나가요!';

    const q = document.createElement('div');
    q.className = 'modal-question';
    q.textContent = '구슬이 있나요?';

    const row = document.createElement('div');
    row.className = 'modal-yesno-row';

    const yesBtn = document.createElement('button');
    yesBtn.className = 'btn-yes';
    yesBtn.textContent = '예';
    yesBtn.addEventListener('click', () => {
      mochiSelected = new Set();
      renderMochiSelect();
    });

    const noBtn = document.createElement('button');
    noBtn.className = 'btn-no';
    noBtn.textContent = '아니요';
    noBtn.addEventListener('click', () => renderFinalResults());

    row.appendChild(yesBtn);
    row.appendChild(noBtn);

    modalCard.appendChild(h2);
    modalCard.appendChild(q);
    modalCard.appendChild(row);

    overlay.classList.add('show');
    yesBtn.focus();
  }

  function renderMochiSelect(){
    modalStep = 'select';
    modalCard.innerHTML = '';

    const h2 = document.createElement('h2');
    h2.textContent = '🎱 모찌 구슬 선택';

    const q = document.createElement('div');
    q.className = 'modal-question';
    q.textContent = '1등, 2등이 아닌 구슬 중 모찌로 나갈 구슬을 선택하세요';

    const grid = document.createElement('div');
    grid.className = 'mochi-grid';

    const remaining = [0,1,2,3].filter(i => i !== ranking[0] && i !== ranking[1]);
    remaining.forEach(i => {
      const btn = document.createElement('button');
      btn.className = 'mochi-btn';
      if(mochiSelected.has(i)) btn.classList.add('selected');

      const badge = document.createElement('div');
      badge.className = 'm-badge';
      badge.style.background = `linear-gradient(160deg, ${COLORS[i]}, ${shade(COLORS[i])})`;
      badge.textContent = NUMS[i];

      const label = document.createElement('div');
      label.textContent = getMarbleName(i);

      btn.appendChild(badge);
      btn.appendChild(label);
      btn.addEventListener('click', () => {
        if(mochiSelected.has(i)) mochiSelected.delete(i);
        else mochiSelected.add(i);
        btn.classList.toggle('selected');
      });
      grid.appendChild(btn);
    });

    const doneBtn = document.createElement('button');
    doneBtn.className = 'btn-confirm';
    doneBtn.textContent = '선택 완료';
    doneBtn.addEventListener('click', () => renderFinalResults());

    modalCard.appendChild(h2);
    modalCard.appendChild(q);
    modalCard.appendChild(grid);
    modalCard.appendChild(doneBtn);
  }

  function renderFinalResults(){
    modalStep = 'final';
    modalCard.innerHTML = '';

    const h2 = document.createElement('h2');
    h2.textContent = '🏁 이번 라운드 최종 결과';
    modalCard.appendChild(h2);

    modalCard.appendChild(buildRankBlock('🥇', '1등', ranking[0]));
    if(ranking[1] !== null){
      modalCard.appendChild(buildRankBlock('🥈', '2등', ranking[1]));
    }
    Array.from(mochiSelected).forEach(i => {
      modalCard.appendChild(buildRankBlock('🎱', '모찌', i));
    });

    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'btn-confirm';
    confirmBtn.textContent = '확인';
    confirmBtn.addEventListener('click', closeModal);
    modalCard.appendChild(confirmBtn);

    overlay.classList.add('show');
    confirmBtn.focus();
  }

  confirmRankBtn.addEventListener('click', () => {
    if(ranking[0] === null) return;
    renderAskMochi();
  });

  function closeModal(){
    overlay.classList.remove('show');
    startNewRound();
  }

  function startNewRound(){
    document.querySelectorAll('#marbleGrid .card').forEach(card => {
      const list = card.querySelector('[data-role="bettor-list"]');
      list.innerHTML = '';
      list.appendChild(createBettorInput(list, false));
      card.querySelector('.name-input').disabled = false;
    });
    ranking = [null, null];
    mochiSelected = new Set();
    modalStep = null;
    updateRaceButtonsUI();
    gameStarted = false;
    raceSection.style.display = 'none';
    setupSection.style.display = 'block';
  }
  function buildRankBlock(medal, title, index){
    const block = document.createElement('div');
    block.className = 'rank-block';

    const head = document.createElement('div');
    head.className = 'rank-block-head';
    head.innerHTML = `<span class="rank-medal">${medal}</span><span class="rank-title">${title}</span>`;
    const nameSpan = document.createElement('span');
    nameSpan.className = 'rank-marble-name';
    nameSpan.textContent = getMarbleName(index);
    head.appendChild(nameSpan);

    const list = document.createElement('ul');
    list.className = 'winner-list';
    const bettors = getBettors(index);
    if(bettors.length === 0){
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '이 구슬에 배팅한 사람이 없습니다';
      list.appendChild(li);
    } else {
      bettors.forEach(name => {
        const li = document.createElement('li');
        li.textContent = name;
        list.appendChild(li);
      });
    }

    block.appendChild(head);
    block.appendChild(list);
    return block;
  }

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && overlay.classList.contains('show') && modalStep === 'final'){
      e.preventDefault();
      closeModal();
    }
  });

  init();
</script>
</body>
</html>
