<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>구슬 레이싱 배팅 일지</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='felt' cx='50%25' cy='40%25' r='70%25'%3E%3Cstop offset='0%25' stop-color='%23164a35'/%3E%3Cstop offset='100%25' stop-color='%2308281c'/%3E%3C/radialGradient%3E%3CradialGradient id='marble' cx='38%25' cy='32%25' r='65%25'%3E%3Cstop offset='0%25' stop-color='%23f6dd8a'/%3E%3Cstop offset='55%25' stop-color='%23d4af37'/%3E%3Cstop offset='100%25' stop-color='%237a5c14'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23felt)' stroke='%23d4af37' stroke-width='2.5'/%3E%3Cg stroke='%23d4af37' stroke-width='3' stroke-linecap='round'%3E%3Cline x1='32' y1='3' x2='32' y2='9'/%3E%3Cline x1='32' y1='55' x2='32' y2='61'/%3E%3Cline x1='3' y1='32' x2='9' y2='32'/%3E%3Cline x1='55' y1='32' x2='61' y2='32'/%3E%3Cline x1='11.5' y1='11.5' x2='15.8' y2='15.8'/%3E%3Cline x1='48.2' y1='48.2' x2='52.5' y2='52.5'/%3E%3Cline x1='11.5' y1='52.5' x2='15.8' y2='48.2'/%3E%3Cline x1='48.2' y1='15.8' x2='52.5' y2='11.5'/%3E%3C/g%3E%3Ccircle cx='32' cy='33' r='15' fill='url(%23marble)' stroke='%237a5c14' stroke-width='1'/%3E%3Cellipse cx='27' cy='27' rx='4.5' ry='3' fill='%23fff6d9' opacity='0.75'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-deep: #0a2e22;
    --felt: #0f3d2b;
    --felt-light: #164a35;
    --ink: #071510;
    --gold: #d4af37;
    --gold-bright: #f0d270;
    --gold-dim: #8a7127;
    --cream: #f1e8d0;
    --cream-dim: #cfc4a2;
    --crimson: #8e1f34;
    --crimson-bright: #c22a45;
    --shadow: rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(212,175,55,0.08), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.6), transparent 70%),
      linear-gradient(180deg, var(--ink) 0%, var(--felt-deep) 40%, var(--ink) 100%);
    background-attachment: fixed;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--cream);
    padding: 40px 20px 80px;
    position: relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(212,175,55,0.02) 0 2px, transparent 2px 40px),
      repeating-linear-gradient(-45deg, rgba(212,175,55,0.02) 0 2px, transparent 2px 40px);
    pointer-events:none;
    z-index:0;
  }

  .wrap{ max-width: 1100px; margin: 0 auto; position:relative; z-index:1; }

  header{ text-align:center; margin-bottom: 36px; }

  .kicker{
    font-family:'Noto Sans KR', sans-serif;
    letter-spacing: 0.35em;
    font-size: 12px;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1{
    font-family:'Noto Serif KR', serif;
    font-weight: 900;
    font-size: clamp(32px, 5vw, 52px);
    margin: 0 0 8px;
    color: var(--gold-bright);
    text-shadow: 0 0 18px rgba(212,175,55,0.35), 0 2px 0 rgba(0,0,0,0.6);
    letter-spacing: 0.02em;
  }

  .sub{
    font-size: 14px;
    color: var(--cream-dim);
    letter-spacing: 0.05em;
  }

  .divider{
    width: 140px; height:2px; margin: 20px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* ---------- Marble Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 22px;
    margin-bottom: 40px;
  }

  .card{
    background: linear-gradient(180deg, var(--felt-light), var(--felt) 60%, var(--felt-deep));
    border: 1px solid rgba(212,175,55,0.35);
    border-radius: 14px;
    padding: 20px 18px 18px;
    position: relative;
    box-shadow: 0 10px 30px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.04);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card:hover{ transform: translateY(-2px); }

  .card::before{
    content:"";
    position:absolute; inset:6px;
    border: 1px solid rgba(212,175,55,0.15);
    border-radius: 10px;
    pointer-events:none;
  }

  .card-head{
    display:flex; align-items:center; gap: 12px;
    margin-bottom: 14px;
    min-width: 0;
  }

  .badge{
    width: 44px; height:44px; min-width:44px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size: 20px;
    color: var(--ink);
    box-shadow: 0 3px 8px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.4);
    border: 2px solid rgba(0,0,0,0.25);
  }

  .name-input{
    flex:1;
    min-width: 0;
    width: 100%;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 8px;
    padding: 10px 12px;
    font-family:'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--gold-bright);
    outline:none;
  }
  .name-input:focus{ border-color: var(--gold); box-shadow: 0 0 0 2px rgba(212,175,55,0.2); }
  .name-input:disabled{
    color: var(--gold-bright);
    opacity: 0.9;
    border-color: rgba(212,175,55,0.15);
    background: rgba(0,0,0,0.35);
  }

  .bettor-label{
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--cream-dim);
    margin: 4px 2px 8px;
  }

  .bettor-list{ display:flex; flex-direction:column; gap: 8px; }

  .bettor-input{
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(241,232,208,0.18);
    border-radius: 7px;
    padding: 9px 11px;
    color: var(--cream);
    font-size: 14px;
    outline:none;
    transition: border-color .15s ease, background .15s ease;
  }
  .bettor-input::placeholder{ color: rgba(241,232,208,0.35); }
  .bettor-input:focus{ border-color: var(--gold); background: rgba(0,0,0,0.35); }
  .bettor-input:disabled{
    opacity: 0.55;
    border-color: rgba(241,232,208,0.08);
  }

  .hint{
    font-size: 11px;
    color: var(--gold-dim);
    margin-top: 8px;
    display:flex; align-items:center; gap:6px;
  }
  .hint::before{ content:"↵"; font-weight:700; }

  /* ---------- Start Button ---------- */
  .action-row{ display:flex; justify-content:center; margin: 10px 0 30px; }

  .btn-start{
    background: linear-gradient(180deg, var(--crimson-bright), var(--crimson));
    color: var(--cream);
    border: 1px solid rgba(212,175,55,0.6);
    padding: 16px 48px;
    font-family:'Noto Serif KR', serif;
    font-weight: 900;
    font-size: 19px;
    letter-spacing: 0.08em;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 8px 24px rgba(142,31,52,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-start:hover{ transform: translateY(-2px); box-shadow: 0 12px 30px rgba(142,31,52,0.6); }
  .btn-start:active{ transform: translateY(0); }
  .btn-start:disabled{
    background: #3a3a3a; color:#888; box-shadow:none; cursor:not-allowed; border-color:#555;
  }

  /* ---------- Race Section ---------- */
  #raceSection{ display:none; text-align:center; }

  .race-q{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size: 24px;
    color: var(--gold-bright);
    margin-bottom: 26px;
  }

  .race-grid{
    display:grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    max-width: 900px;
    margin: 0 auto 30px;
  }

  @media (max-width: 480px){
    .race-grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .race-btn{ padding: 14px 4px; font-size: 13px; }
    .race-btn .r-badge{ width: 30px; height: 30px; margin-bottom: 6px; }
  }

  .race-btn{
    background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent);
    border: 2px solid var(--gold-dim);
    border-radius: 12px;
    padding: 22px 10px;
    cursor:pointer;
    color: var(--cream);
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size: 16px;
    transition: all .15s ease;
    position:relative;
  }
  .race-btn .r-badge{
    width:38px;height:38px;border-radius:50%;margin:0 auto 10px;
    display:flex;align-items:center;justify-content:center;
    font-weight:900; color: var(--ink);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.4);
  }
  .race-btn:hover{ border-color: var(--gold); background: rgba(212,175,55,0.08); transform: translateY(-3px); }

  .back-link{
    background:none; border:none; color: var(--cream-dim); text-decoration:underline;
    cursor:pointer; font-size: 13px; margin-top: 6px;
  }

  /* ---------- Modal ---------- */
  .overlay{
    display:none;
    position: fixed; inset:0;
    background: rgba(2,8,5,0.78);
    backdrop-filter: blur(3px);
    align-items:center; justify-content:center;
    z-index: 100;
    padding: 20px;
  }
  .overlay.show{ display:flex; }

  .modal{
    background: linear-gradient(180deg, var(--felt-light), var(--felt-deep));
    border: 1px solid var(--gold);
    border-radius: 16px;
    max-width: 460px; width:100%;
    padding: 30px 28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    text-align:center;
    animation: pop .18s ease;
  }
  @keyframes pop{ from{ transform: scale(0.92); opacity:0;} to{ transform:scale(1); opacity:1; } }

  .modal .trophy{ font-size: 34px; margin-bottom: 6px; }
  .modal h2{
    font-family:'Noto Serif KR', serif;
    color: var(--gold-bright);
    font-size: 22px;
    margin: 0 0 4px;
  }
  .modal .win-name{
    font-family:'Noto Serif KR', serif;
    font-size: 26px;
    font-weight: 900;
    color: var(--gold-bright);
    margin-bottom: 18px;
    text-shadow: 0 0 12px rgba(212,175,55,0.4);
  }

  .winner-list{
    list-style:none; padding:0; margin: 0 0 22px;
    display:flex; flex-direction:column; gap:8px;
    max-height: 240px; overflow-y:auto;
  }
  .winner-list li{
    background: rgba(212,175,55,0.08);
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 8px;
    padding: 10px;
    font-size: 15px;
    color: var(--cream);
  }
  .winner-list .empty{
    color: var(--cream-dim);
    font-style: italic;
    background: rgba(255,255,255,0.03);
    border-style: dashed;
  }

  .btn-confirm{
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: var(--ink);
    border:none;
    padding: 12px 40px;
    border-radius: 999px;
    font-weight:700;
    font-size: 15px;
    cursor:pointer;
    letter-spacing: 0.04em;
  }
  .btn-confirm:hover{ filter: brightness(1.05); }

  .new-round-wrap{ text-align:center; margin-top: 10px; display:none; }
  .btn-newround{
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--gold-bright);
    padding: 10px 26px;
    border-radius: 999px;
    font-size: 13px;
    cursor:pointer;
    letter-spacing: 0.05em;
  }
  .btn-newround:hover{ border-color: var(--gold); background: rgba(212,175,55,0.08); }

  footer{
    text-align:center; margin-top: 50px;
    color: var(--cream-dim); font-size: 11px; letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">Class Booth &middot; Table Log</div>
    <h1>구슬 레이싱 배팅 일지</h1>
    <div class="sub">여섯 개의 구슬, 하나의 승자 — 배팅을 기록하세요</div>
    <div class="divider"></div>
  </header>

  <section id="setupSection">
    <div class="grid" id="marbleGrid"></div>
    <div class="action-row">
      <button class="btn-start" id="startBtn">게임 시작</button>
    </div>
  </section>

  <section id="raceSection">
    <div class="race-q">어느 구슬이 먼저 도착했나요?</div>
    <div class="race-grid" id="raceGrid"></div>
    <button class="back-link" id="backBtn">← 배팅 다시 설정하기</button>
    <div class="new-round-wrap" id="newRoundWrap">
      <button class="btn-newround" id="newRoundBtn">다음 게임 · 새 배팅 받기</button>
    </div>
  </section>

  <footer>DAEGON HIGH SCHOOL &nbsp;·&nbsp; MARBLE RACE TABLE &nbsp;·&nbsp; MADE BY HYUNSU</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="trophy">🏆</div>
    <h2>우승 구슬</h2>
    <div class="win-name" id="winName"></div>
    <ul class="winner-list" id="winnerList"></ul>
    <button class="btn-confirm" id="confirmBtn">확인</button>
  </div>
</div>

<script>
  const NUMS = ['①','②','③','④','⑤','⑥'];
  const COLORS = ['#c0392b','#2980b9','#2e9e5b','#8e44ad','#e0a628','#dfe4e8'];

  const marbleGrid = document.getElementById('marbleGrid');
  const raceGrid = document.getElementById('raceGrid');
  const setupSection = document.getElementById('setupSection');
  const raceSection = document.getElementById('raceSection');
  const startBtn = document.getElementById('startBtn');
  const backBtn = document.getElementById('backBtn');
  const newRoundBtn = document.getElementById('newRoundBtn');
  const newRoundWrap = document.getElementById('newRoundWrap');
  const overlay = document.getElementById('overlay');
  const winName = document.getElementById('winName');
  const winnerList = document.getElementById('winnerList');
  const confirmBtn = document.getElementById('confirmBtn');

  let gameStarted = false;

  function createBettorInput(container, isDisabled){
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'bettor-input';
    input.placeholder = '배팅자 이름 입력 후 Enter';
    input.disabled = isDisabled;
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        if(input.value.trim() === '') return;
        const inputs = container.querySelectorAll('.bettor-input');
        const isLast = inputs[inputs.length - 1] === input;
        if(isLast){
          const next = createBettorInput(container, false);
          container.appendChild(next);
          next.focus();
        }
      }
    });
    return input;
  }

  function buildMarbleCard(index){
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = index;

    const head = document.createElement('div');
    head.className = 'card-head';

    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.style.background = `linear-gradient(160deg, ${COLORS[index]}, ${shade(COLORS[index])})`;
    badge.textContent = NUMS[index];

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'name-input';
    nameInput.value = `구슬 ${NUMS[index]}`;
    nameInput.dataset.role = 'marble-name';

    head.appendChild(badge);
    head.appendChild(nameInput);

    const label = document.createElement('div');
    label.className = 'bettor-label';
    label.textContent = '배팅자 명단';

    const list = document.createElement('div');
    list.className = 'bettor-list';
    list.dataset.role = 'bettor-list';
    list.appendChild(createBettorInput(list, false));

    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = 'Enter 키를 누르면 다음 배팅자 칸이 생성됩니다';

    card.appendChild(head);
    card.appendChild(label);
    card.appendChild(list);
    card.appendChild(hint);
    return card;
  }

  function shade(hex){
    // simple darken for gradient companion tone
    const n = parseInt(hex.slice(1),16);
    let r = (n>>16) - 40, g = ((n>>8)&0xff) - 40, b = (n&0xff) - 40;
    r = Math.max(0,r); g = Math.max(0,g); b = Math.max(0,b);
    return `rgb(${r},${g},${b})`;
  }

  function init(){
    marbleGrid.innerHTML = '';
    raceGrid.innerHTML = '';
    for(let i=0;i<6;i++){
      marbleGrid.appendChild(buildMarbleCard(i));

      const rb = document.createElement('button');
      rb.className = 'race-btn';
      rb.dataset.index = i;
      const rBadge = document.createElement('div');
      rBadge.className = 'r-badge';
      rBadge.style.background = `linear-gradient(160deg, ${COLORS[i]}, ${shade(COLORS[i])})`;
      rBadge.textContent = NUMS[i];
      const rLabel = document.createElement('div');
      rLabel.dataset.role = 'race-label';
      rLabel.textContent = `구슬 ${NUMS[i]}`;
      rb.appendChild(rBadge);
      rb.appendChild(rLabel);
      rb.addEventListener('click', () => showWinner(i));
      raceGrid.appendChild(rb);
    }
  }

  startBtn.addEventListener('click', () => {
    // lock all inputs
    document.querySelectorAll('.name-input, .bettor-input').forEach(el => el.disabled = true);
    // sync race button labels with chosen marble names
    document.querySelectorAll('#marbleGrid .card').forEach(card => {
      const idx = card.dataset.index;
      const nameVal = card.querySelector('.name-input').value.trim() || `구슬 ${NUMS[idx]}`;
      const label = raceGrid.querySelector(`.race-btn[data-index="${idx}"] [data-role="race-label"]`);
      label.textContent = nameVal;
    });
    gameStarted = true;
    setupSection.style.display = 'none';
    raceSection.style.display = 'block';
    newRoundWrap.style.display = 'none';
  });

  backBtn.addEventListener('click', () => {
    document.querySelectorAll('.name-input, .bettor-input').forEach(el => el.disabled = false);
    gameStarted = false;
    raceSection.style.display = 'none';
    setupSection.style.display = 'block';
  });

  function showWinner(index){
    const card = marbleGrid.querySelector(`.card[data-index="${index}"]`);
    const nameVal = card.querySelector('.name-input').value.trim() || `구슬 ${NUMS[index]}`;
    const bettors = Array.from(card.querySelectorAll('.bettor-input'))
      .map(i => i.value.trim())
      .filter(v => v !== '');

    winName.textContent = nameVal;
    winnerList.innerHTML = '';
    if(bettors.length === 0){
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '이 구슬에 배팅한 사람이 없습니다';
      winnerList.appendChild(li);
    } else {
      bettors.forEach(name => {
        const li = document.createElement('li');
        li.textContent = name;
        winnerList.appendChild(li);
      });
    }
    overlay.classList.add('show');
    confirmBtn.focus();
  }

  function closeModal(){
    overlay.classList.remove('show');
    newRoundWrap.style.display = 'block';
  }

  confirmBtn.addEventListener('click', closeModal);
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && overlay.classList.contains('show')){
      e.preventDefault();
      closeModal();
    }
  });

  newRoundBtn.addEventListener('click', () => {
    // keep marble names, clear bettor lists back to one empty enabled input each
    document.querySelectorAll('#marbleGrid .card').forEach(card => {
      const list = card.querySelector('[data-role="bettor-list"]');
      list.innerHTML = '';
      list.appendChild(createBettorInput(list, false));
      card.querySelector('.name-input').disabled = false;
    });
    gameStarted = false;
    raceSection.style.display = 'none';
    setupSection.style.display = 'block';
    newRoundWrap.style.display = 'none';
  });

  init();
</script>
</body>
</html>
